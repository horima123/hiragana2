<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ひらがな うずまきマッチング</title>

    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts for legible Japanese text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Zen Maru Gothic', 'Kosugi Maru', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #0f172a;
        }

        /* 3D Dynamic Card Styling */
        .hiragana-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.4), 0 5px 10px rgba(0, 0, 0, 0.2);
            touch-action: none;
        }

        .hiragana-card:active {
            transform: scale(0.95);
        }

        /* Suction Animation Target Classes */
        .sucking {
            pointer-events: none;
            transition: none !important;
            z-index: 40 !important;
        }

        /* Custom Wave Pattern Overlay */
        .ocean-bg {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 40%, #0369a1 100%);
        }

        /* Floating Animation for speaker button */
        @keyframes pulse-gentle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .pulse-speaker {
            animation: pulse-gentle 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="ocean-bg h-screen w-screen relative flex flex-col justify-between items-center text-white select-none overflow-hidden">

    <!-- 上部操作・提示エリア（渦巻き領域と完全に分離） -->

        <!-- ヘッダー・視覚的進捗バー -->

                <svg class="w-7 h-7 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>

                </svg>

    <!-- 【クリア達成モーダル】全問正解時 -->

            <button id="btn-next-game" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-2xl py-4 rounded-2xl shadow-lg border-2 border-amber-200 active:scale-98 transition-all">

    <script>
        /**
         * Web Audio API による効果音生成器（外部音声ファイル非依存）
         */
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // 正解音（明るいチャイム）
            playCorrect() {
                this.init();
                const now = this.ctx.currentTime;
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc1.type = 'sine';
                osc2.type = 'sine';

                osc1.frequency.setValueAtTime(523.25, now); // C5
                osc1.frequency.setValueAtTime(659.25, now + 0.12); // E5
                osc1.frequency.setValueAtTime(783.99, now + 0.24); // G5
                osc1.frequency.setValueAtTime(1046.50, now + 0.36); // C6

                osc2.frequency.setValueAtTime(523.25 * 1.005, now);
                osc2.frequency.setValueAtTime(659.25 * 1.005, now + 0.12);
                osc2.frequency.setValueAtTime(783.99 * 1.005, now + 0.24);
                osc2.frequency.setValueAtTime(1046.50 * 1.005, now + 0.36);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.8);
                osc2.stop(now + 0.8);
            }

            // 吸い込み音（2.1秒のゆったり水流スパイラル＋泡ポチャ音の重層化）
            playSuck() {
                this.init();
                const now = this.ctx.currentTime;
                const duration = 2.1;

                // 1. 低音の水流渦巻きベース音
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(360, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + duration);

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, now);
                filter.frequency.linearRampToValueAtTime(120, now + duration);

                gain.gain.setValueAtTime(0.22, now);
                gain.gain.linearRampToValueAtTime(0.01, now + duration);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + duration);

                // 2. リアルな泡（ポチャッ・ポコポコ音）のオーバーレイ生成
                const numBubbles = 18;
                for (let i = 0; i < numBubbles; i++) {
                    const bubbleTime = now + Math.random() * (duration - 0.15);
                    const bOsc = this.ctx.createOscillator();
                    const bGain = this.ctx.createGain();

                    bOsc.type = 'sine';
                    const startFreq = 220 + Math.random() * 600;
                    const endFreq = startFreq * (1.3 + Math.random() * 0.6);

                    bOsc.frequency.setValueAtTime(startFreq, bubbleTime);
                    bOsc.frequency.exponentialRampToValueAtTime(endFreq, bubbleTime + 0.04);

                    bGain.gain.setValueAtTime(0.001, bubbleTime);
                    bGain.gain.linearRampToValueAtTime(0.07 + Math.random() * 0.05, bubbleTime + 0.01);
                    bGain.gain.exponentialRampToValueAtTime(0.001, bubbleTime + 0.05);

                    bOsc.connect(bGain);
                    bGain.connect(this.ctx.destination);

                    bOsc.start(bubbleTime);
                    bOsc.stop(bubbleTime + 0.06);
                }
            }

            // 不正解音（ブザー）
            playWrong() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.setValueAtTime(130, now + 0.25);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        /**
         * 日本語平仮名 音声読み上げ管理（Web Speech API）
         */
        class VoiceReader {
            constructor() {
                this.synth = window.speechSynthesis;
                this.voice = null;
                this.setupVoice();
            }

            setupVoice() {
                if (!this.synth) return;
                const updateVoice = () => {
                    const voices = this.synth.getVoices();
                    this.voice = voices.find(v => v.lang === 'ja-JP' || v.lang.startsWith('ja')) || voices[0];
                };
                updateVoice();
                if (this.synth.onvoiceschanged !== undefined) {
                    this.synth.onvoiceschanged = updateVoice;
                }
            }

            speakChar(char, callback) {
                if (!this.synth) {
                    if (callback) callback();
                    return;
                }

                this.synth.cancel();

                const utterance = new SpeechSynthesisUtterance(char);
                if (this.voice) utterance.voice = this.voice;
                utterance.lang = 'ja-JP';
                utterance.rate = 0.85;
                utterance.pitch = 1.1;

                let finished = false;
                const done = () => {
                    if (!finished) {
                        finished = true;
                        if (callback) callback();
                    }
                };

                utterance.onend = done;
                utterance.onerror = done;

                this.synth.speak(utterance);
            }
        }

        /**
         * 斜め上アングルの水流渦巻き Canvas グラフィックエンジン
         */
        class WhirlpoolEngine {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.numParticles = 220;
                this.angleOffset = 0;
                this.resize();

                window.addEventListener('resize', () => this.resize());
                this.initParticles();
            }

            resize() {
                if (!this.canvas.parentElement) return;
                this.width = this.canvas.width = this.canvas.parentElement.clientWidth || window.innerWidth;
                this.height = this.canvas.height = this.canvas.parentElement.clientHeight || (window.innerHeight * 0.45);
                this.centerX = this.width / 2;
                this.centerY = this.height * 0.5;
                this.radiusX = this.width * 0.45;
                this.radiusY = this.height * 0.42;
            }

            initParticles() {
                this.particles = [];
                for (let i = 0; i < this.numParticles; i++) {
                    this.particles.push({
                        distanceRatio: Math.random(),
                        angle: Math.random() * Math.PI * 2,
                        speed: 0.01 + Math.random() * 0.02,
                        size: 2 + Math.random() * 4.5,
                        opacity: 0.3 + Math.random() * 0.7,
                        isFoam: Math.random() > 0.4
                    });
                }
            }

            getCenterScreenPos() {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: rect.left + this.centerX,
                    y: rect.top + this.centerY
                };
            }

            render() {
                if (!this.width || !this.height) this.resize();
                this.ctx.clearRect(0, 0, this.width, this.height);
                this.angleOffset += 0.015;

                // 1. 渦のベースグラデーション背景
                const bgGradient = this.ctx.createRadialGradient(
                    this.centerX, this.centerY, 10,
                    this.centerX, this.centerY, Math.max(this.radiusX, this.radiusY)
                );
                bgGradient.addColorStop(0, '#020617');
                bgGradient.addColorStop(0.18, '#082f49');
                bgGradient.addColorStop(0.45, '#0284c7');
                bgGradient.addColorStop(0.75, '#0369a1');
                bgGradient.addColorStop(1, 'transparent');

                this.ctx.save();
                this.ctx.beginPath();
                this.ctx.ellipse(this.centerX, this.centerY, this.radiusX * 1.2, this.radiusY * 1.2, -0.05, 0, Math.PI * 2);
                this.ctx.fillStyle = bgGradient;
                this.ctx.fill();
                this.ctx.restore();

                // 2. 渦巻きの螺旋バンド描画
                this.ctx.save();
                this.ctx.translate(this.centerX, this.centerY);
                this.ctx.scale(1, this.radiusY / this.radiusX);

                const arms = 5;
                for (let i = 0; i < arms; i++) {
                    const armAngle = this.angleOffset + (i * Math.PI * 2 / arms);
                    this.ctx.beginPath();
                    for (let r = 20; r < this.radiusX; r += 5) {
                        const theta = armAngle + (r * 0.02);
                        const x = Math.cos(theta) * r;
                        const y = Math.sin(theta) * r;
                        if (r === 20) this.ctx.moveTo(x, y);
                        else this.ctx.lineTo(x, y);
                    }
                    this.ctx.strokeStyle = i % 2 === 0 ? 'rgba(186, 230, 253, 0.25)' : 'rgba(56, 189, 248, 0.2)';
                    this.ctx.lineWidth = 12;
                    this.ctx.lineCap = 'round';
                    this.ctx.stroke();
                }
                this.ctx.restore();

                // 3. 吸い込まれる水流粒子＆白い泡飛沫（フォーム）
                for (let p of this.particles) {
                    p.angle += p.speed * (1.8 - p.distanceRatio);
                    p.distanceRatio -= 0.002;

                    if (p.distanceRatio <= 0.02) {
                        p.distanceRatio = 0.95 + Math.random() * 0.05;
                        p.angle = Math.random() * Math.PI * 2;
                    }

                    const currentRx = this.radiusX * p.distanceRatio;
                    const currentRy = this.radiusY * p.distanceRatio;
                    const px = this.centerX + Math.cos(p.angle) * currentRx;
                    const py = this.centerY + Math.sin(p.angle) * currentRy;

                    this.ctx.beginPath();
                    this.ctx.arc(px, py, p.size * (0.5 + p.distanceRatio * 0.5), 0, Math.PI * 2);

                    if (p.isFoam) {
                        this.ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity * p.distanceRatio})`;
                    } else {
                        this.ctx.fillStyle = `rgba(125, 211, 252, ${p.opacity * p.distanceRatio})`;
                    }
                    this.ctx.fill();
                }

                // 4. 中心穴
                this.ctx.save();
                this.ctx.beginPath();
                this.ctx.ellipse(this.centerX, this.centerY, 28, 16, 0, 0, Math.PI * 2);
                this.ctx.fillStyle = '#020617';
                this.ctx.shadowColor = '#38bdf8';
                this.ctx.shadowBlur = 15;
                this.ctx.fill();
                this.ctx.restore();

                requestAnimationFrame(() => this.render());
            }
        }

        const HIRAGANA_GROUPS = {
            a: ['あ', 'い', 'う', 'え', 'お'],
            ka: ['あ', 'い', 'う', 'え', 'お', 'か', 'き', 'く', 'け', 'こ'],
            sa: ['あ', 'い', 'う', 'え', 'お', 'か', 'き', 'く', 'け', 'こ', 'さ', 'し', 'す', 'せ', 'そ'],
            all: [
                'あ','い','う','え','お',
                'か','き','く','け','こ',
                'さ','し','す','せ','そ',
                'た','ち','つ','て','と',
                'な','に','ぬ','ね','の',
                'は','ひ','ふ','へ','ほ',
                'ま','み','む','め','も',
                'や','ゆ','よ',
                'ら','り','る','れ','ろ',
                'わ','を','ん'
            ]
        };

        /**
         * メインアプリケーション制御クラス
         */
        class App {
            constructor() {
                this.sound = new SoundFX();
                this.voice = new VoiceReader();
                this.canvas = document.getElementById('whirlpool-canvas');
                this.whirlpool = new WhirlpoolEngine(this.canvas);

                this.selectedGroup = 'a';
                this.totalQuestions = 5;
                this.currentQuestionIndex = 0;
                this.activeStep = 0;
                this.targetChar = '';
                this.leftChar = '';
                this.rightChar = '';
                this.isAnimating = false;
                this.isSpeaking = false;

                this.initUI();
                this.startNewGame();
            }

            initUI() {
                // スピーカーボタン
                document.getElementById('btn-play-sound').addEventListener('click', () => {
                    this.speakCurrentTarget();
                });

                // カードのクリック/タッチイベント
                document.getElementById('card-0').addEventListener('click', (e) => this.handleCardSelect(0, e.currentTarget));
                document.getElementById('card-1').addEventListener('click', (e) => this.handleCardSelect(1, e.currentTarget));

                // 設定モーダル制御
                document.getElementById('btn-settings').addEventListener('click', () => {
                    document.getElementById('modal-settings').classList.remove('hidden');
                });

                document.getElementById('btn-close-settings').addEventListener('click', () => {
                    document.getElementById('modal-settings').classList.add('hidden');
                    this.startNewGame();
                });

                // リスタートボタン
                document.getElementById('btn-restart').addEventListener('click', () => {
                    this.startNewGame();
                });

                // 再挑戦ボタン
                document.getElementById('btn-retry').addEventListener('click', () => {
                    document.getElementById('modal-wrong').classList.add('hidden');
                    this.startNewGame();
                });

                // 次のゲームへ
                document.getElementById('btn-next-game').addEventListener('click', () => {
                    document.getElementById('modal-clear').classList.add('hidden');
                    this.startNewGame();
                });

                // 難易度グループ選択UI
                const groupBtns = document.querySelectorAll('.btn-group-select');
                groupBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        groupBtns.forEach(b => {
                            b.classList.remove('bg-cyan-600', 'border-cyan-300');
                            b.classList.add('bg-slate-700', 'border-slate-500');
                        });
                        e.currentTarget.classList.remove('bg-slate-700', 'border-slate-500');
                        e.currentTarget.classList.add('bg-cyan-600', 'border-cyan-300');
                        this.selectedGroup = e.currentTarget.dataset.group;
                    });
                });

                // Canvas描画スタート
                this.whirlpool.render();
            }

            startNewGame() {
                this.currentQuestionIndex = 0;
                this.renderProgress();
                this.setupNextQuestion();
            }

            renderProgress() {
                const container = document.getElementById('progress-container');
                container.innerHTML = '';
                for (let i = 0; i < this.totalQuestions; i++) {
                    const star = document.createElement('div');
                    star.className = 'w-7 h-7 flex items-center justify-center transition-all duration-300';
                    if (i < this.currentQuestionIndex) {
                        star.innerHTML = `<svg class="w-6 h-6 text-amber-400 drop-shadow" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
                    } else if (i === this.currentQuestionIndex) {
                        star.innerHTML = `<svg class="w-7 h-7 text-cyan-300 animate-pulse" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
                    } else {
                        star.innerHTML = `<div class="w-3 h-3 rounded-full bg-slate-700 border border-slate-500"></div>`;
                    }
                    container.appendChild(star);
                }
            }

            setupNextQuestion() {
                this.isAnimating = false;
                this.isSpeaking = false;
                this.activeStep = 0;

                // タッチ制御のロック解除
                const cardsContainer = document.getElementById('cards-container');
                const btnSound = document.getElementById('btn-play-sound');
                if (cardsContainer) cardsContainer.style.pointerEvents = 'auto';
                if (btnSound) btnSound.style.pointerEvents = 'auto';

                const card0 = document.getElementById('card-0');
                const card1 = document.getElementById('card-1');
                [card0, card1].forEach(c => {
                    c.style.visibility = 'visible';
                    c.style.opacity = '1';
                    c.style.transform = 'none';
                    c.style.filter = 'none';
                    c.style.position = 'relative';
                    c.style.left = 'auto';
                    c.style.top = 'auto';
                    c.classList.remove('sucking');
                });

                // グループからランダムに2文字選択
                const group = HIRAGANA_GROUPS[this.selectedGroup];
                const shuffled = [...group].sort(() => Math.random() - 0.5);
                this.leftChar = shuffled[0];
                this.rightChar = shuffled[1];

                // 2文字のうちどちらか一方をターゲットに選ぶ
                this.targetChar = Math.random() < 0.5 ? this.leftChar : this.rightChar;

                // UI更新
                document.querySelector('#card-0 .card-text').textContent = this.leftChar;
                document.querySelector('#card-1 .card-text').textContent = this.rightChar;

                // 自動でターゲット音声を再生
                setTimeout(() => {
                    this.speakCurrentTarget();
                }, 300);
            }

            speakCurrentTarget(callback) {
                if (this.isSpeaking) return;
                this.sound.init();
                this.isSpeaking = true;

                // 再生中はカードおよびスピーカーボタンのタッチ操作をロック
                const cardsContainer = document.getElementById('cards-container');
                const btnSound = document.getElementById('btn-play-sound');
                if (cardsContainer) cardsContainer.style.pointerEvents = 'none';
                if (btnSound) btnSound.style.pointerEvents = 'none';

                let unlocked = false;
                const unlock = () => {
                    if (unlocked) return;
                    unlocked = true;
                    this.isSpeaking = false;
                    if (cardsContainer) cardsContainer.style.pointerEvents = 'auto';
                    if (btnSound) btnSound.style.pointerEvents = 'auto';
                    if (callback && typeof callback === 'function') callback();
                };

                // セーフティタイマー（最大1.8秒で強制解除）
                const safetyTimer = setTimeout(unlock, 1800);

                this.voice.speakChar(this.targetChar, () => {
                    clearTimeout(safetyTimer);
                    unlock();
                });
            }

            handleCardSelect(cardIdx, cardElem) {
                if (this.isAnimating || this.isSpeaking) return;

                const selectedChar = cardIdx === 0 ? this.leftChar : this.rightChar;

                if (selectedChar === this.targetChar) {
                    this.isAnimating = true;
                    this.sound.playCorrect();

                    this.animateSuckIntoWhirlpool(cardElem, () => {
                        cardElem.style.visibility = 'hidden';

                        if (this.activeStep === 0) {
                            this.activeStep = 1;
                            this.targetChar = (cardIdx === 0) ? this.rightChar : this.leftChar;
                            this.isAnimating = false;

                            setTimeout(() => {
                                this.speakCurrentTarget();
                            }, 500);
                        } else {
                            this.currentQuestionIndex++;
                            this.renderProgress();

                            if (this.currentQuestionIndex >= this.totalQuestions) {
                                setTimeout(() => {
                                    document.getElementById('modal-clear').classList.remove('hidden');
                                }, 600);
                            } else {
                                setTimeout(() => {
                                    this.setupNextQuestion();
                                }, 700);
                            }
                        }
                    });

                } else {
                    // 間違えた場合 -> そこで問題終了
                    this.sound.playWrong();
                    this.isAnimating = true;
                    setTimeout(() => {
                        document.getElementById('modal-wrong').classList.remove('hidden');
                    }, 400);
                }
            }

            // カードがゆっくりと渦潮の回転・パースに合わせて引き込まれるアニメーション
            animateSuckIntoWhirlpool(cardElem, onComplete) {
                this.sound.playSuck();

                cardElem.classList.add('sucking');
                const cardRect = cardElem.getBoundingClientRect();
                const centerPos = this.whirlpool.getCenterScreenPos();

                const startX = cardRect.left + cardRect.width / 2;
                const startY = cardRect.top + cardRect.height / 2;
                const targetX = centerPos.x;
                const targetY = centerPos.y;

                const dx = startX - targetX;
                const dy = (startY - targetY) / 0.45;
                const initialRadius = Math.hypot(dx, dy);
                const initialAngle = Math.atan2(dy, dx);

                const startTime = performance.now();
                const duration = 2100;

                const animateFrame = (now) => {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    const radiusRatio = Math.pow(1 - progress, 1.35);
                    const currentRadius = initialRadius * radiusRatio;

                    const currentAngle = initialAngle + progress * Math.PI * 7;

                    const currentX = targetX + Math.cos(currentAngle) * currentRadius;
                    const currentY = targetY + Math.sin(currentAngle) * currentRadius * 0.45;

                    const tiltX = 55 * progress;
                    const selfSpin = progress * 540;
                    const scale = Math.max(0.05, (1 - progress * 0.88));

                    const blurAmount = progress * 7;
                    const opacity = Math.max(0, 1 - Math.pow(progress, 2.5));
                    const brightness = Math.max(0.2, 1 - progress * 0.8);

                    cardElem.style.position = 'fixed';
                    cardElem.style.left = `${currentX - cardRect.width / 2}px`;
                    cardElem.style.top = `${currentY - cardRect.height / 2}px`;
                    cardElem.style.transform = `perspective(600px) rotateX(${tiltX}deg) rotateZ(${selfSpin}deg) scale(${scale})`;
                    cardElem.style.filter = `blur(${blurAmount}px) brightness(${brightness})`;
                    cardElem.style.opacity = opacity;

                    if (progress < 1) {
                        requestAnimationFrame(animateFrame);
                    } else {
                        onComplete();
                    }
                };

                requestAnimationFrame(animateFrame);
            }
        }

        window.addEventListener('load', () => {
            window.app = new App();
        });
    </script>
